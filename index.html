<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soleiman Arebi · Developer</title>
  <meta name="description" content="Soleiman Arebi: AI, machine learning, network control, quantum mechanics and energy analysers." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='5' y='22' font-family='monospace' font-size='16' fill='%2339d353'>&gt;_</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="title">soleiman@arebi: ~/portfolio</span>
      <button class="theme" id="theme" aria-label="Toggle colour theme">◐</button>
    </header>

    <div class="ide">
      <nav class="explorer" aria-label="Sections">
        <div class="explorer-head">EXPLORER</div>
        <div class="folder">▾ portfolio</div>
        <ul id="files"></ul>
      </nav>

      <main class="editor">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="code" id="code" tabindex="0" aria-live="polite"></div>
      </main>
    </div>

    <section class="terminal" aria-label="Terminal">
      <div class="term-head"><span>TERMINAL</span><span class="hint">type <b>help</b></span></div>
      <div class="term-body" id="term">
        <div id="term-out"></div>
        <form id="term-form" class="prompt-line" autocomplete="off">
          <label for="term-in" class="ps1">soleiman@arebi:~$</label>
          <input id="term-in" spellcheck="false" aria-label="Terminal input" />
        </form>
      </div>
    </section>

    <footer class="statusbar">
      <span>⎇ main</span>
      <span id="status-file">about.md</span>
      <span class="right">UTF-8 · <span id="status-lang">Markdown</span></span>
    </footer>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
